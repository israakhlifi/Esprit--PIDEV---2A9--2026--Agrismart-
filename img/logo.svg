<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1024" width="960" height="1024">

  <!-- Ligne de base -->
  <rect x="130" y="830" width="700" height="28" rx="14" fill="#17352A"/>

  <!-- Barre gauche (petite) — vert moyen -->
  <rect x="165" y="640" width="155" height="195" rx="30" fill="#2C7A46"/>

  <!-- Barre centrale (moyenne) — vert moyen -->
  <rect x="400" y="490" width="155" height="345" rx="30" fill="#2C7A46"/>

  <!-- Barre droite (grande) — vert foncé -->
  <rect x="635" y="300" width="155" height="535" rx="30" fill="#17352A"/>

  <!-- Ligne de tendance ocre -->
  <line x1="242" y1="640" x2="478" y2="490" stroke="#C8963E" stroke-width="22" stroke-linecap="round"/>
  <line x1="478" y1="490" x2="712" y2="300" stroke="#C8963E" stroke-width="22" stroke-linecap="round"/>

  <!-- Points sur la ligne -->
  <circle cx="242" cy="640" r="28" fill="#C8963E"/>
  <circle cx="478" cy="490" r="28" fill="#C8963E"/>
  <!-- Le 3e point est caché derrière la feuille -->

  <!-- Tige de la feuille -->
  <line x1="712" y1="300" x2="750" y2="175" stroke="#C8963E" stroke-width="18" stroke-linecap="round"/>

  <!-- Feuille (ellipse pivotée) -->
  <ellipse cx="800" cy="130" rx="95" ry="58"
           transform="rotate(-30 800 130)"
           fill="#90C8A0" stroke="#2C7A46" stroke-width="16"/>

  <!-- Veine centrale de la feuille -->
  <line x1="750" y1="165" x2="855" y2="95"
        stroke="#2C7A46" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

</svg>
